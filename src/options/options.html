<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article to Print — Settings</title>
    <link rel="stylesheet" href="../styles/shared.css" />
    <script type="module" src="./options.ts"></script>
  </head>
  <body>
    <div class="options-page">
      <div class="options-card">
        <h1>Settings</h1>
        <p>
          AI conversion uses your OpenRouter API key. The key is stored only on this
          device. Page HTML is sent to OpenRouter only when you click
          <strong>AI conversion</strong>.
        </p>

        <form id="settings-form">
          <div class="options-field">
            <label for="openrouter-key">OpenRouter API key</label>
            <input
              type="password"
              id="openrouter-key"
              name="openrouter-key"
              autocomplete="off"
              spellcheck="false"
              placeholder="sk-or-…"
            />
          </div>

          <div class="options-actions">
            <button type="submit" id="save-btn" class="btn btn-primary">Save</button>
            <button type="button" id="clear-btn" class="btn btn-ghost">Clear</button>
          </div>
        </form>

        <p id="settings-status" class="options-status" role="status" hidden></p>
        <p class="options-hint">
          Get a free key at
          <a href="https://openrouter.ai/keys" target="_blank" rel="noopener noreferrer"
            >openrouter.ai/keys</a
          >.
        </p>
      </div>
    </div>
  </body>
</html>
